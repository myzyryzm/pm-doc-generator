# RealWorld / Conduit — the development target.
# A new app needs only a file like this one: point each repo at a path, and use
# `hints` for anything an engineer would tell a new teammate on day one.
# Repo paths are relative to PROJECT_FOLDER (set in .env), the folder that holds
# this project's repos.
name: realworld
description: >
  RealWorld "Conduit" — a Medium-style blogging app. Readers browse a global
  feed or a personal feed of authors they follow, filter by tag, and read
  articles. Signed-in users write, edit and delete articles, comment, favorite
  articles, follow other authors, and manage their profile and settings.

repos:
  - name: backend
    path: backend                  # relative to PROJECT_FOLDER, absolute, or ~
    kind: backend                  # frontend | backend | service | worker | unknown (optional; auto-detected)
    hints: |
      Serverless Framework on AWS Lambda (Python 3.9) with DynamoDB via boto3.
      Every HTTP route is declared in serverless/serverless.yml under `functions:`
      (handler: src/<module>.<func>; events: - http: {path, method}).
      Handlers live in serverless/src/{article,comment,user}.py with the Lambda
      signature (event, context). Some handlers serve two routes and branch on
      event["httpMethod"] (favorite/unfavorite, follow/unfollow).
      There is no ORM: tables are used directly with put_item/get_item/query/scan,
      and their keys and indexes exist only in the serverless.yml resources block.
      Auth is opt-in per handler via user.authenticate_and_get_user(event).
      serverless/commonPackages/ is vendored third-party code — ignore it.

  - name: frontend
    path: frontend
    kind: frontend
    hints: |
      React 17 + Redux Toolkit + react-router v5 (HashRouter) + axios, TypeScript.
      ALL HTTP calls are in src/services/conduit.ts (paths are relative to the
      axios baseURL and use template literals like `articles/${slug}/favorite`).
      Routes are declared in src/components/App/App.tsx. Pages live in
      src/components/Pages/<Name>/<Name>.tsx with a sibling <Name>.slice.ts for state.
      Click and submit handlers are often module-level functions passed down
      through shared components (e.g. ArticleEditor -> GenericForm), so follow
      the prop chain to the real handler. *.test.tsx files are tests, not behavior.

# Stripped from backend route paths before matching frontend calls to routes.
# A prefix shared by every route is also inferred automatically.
api_prefixes: ["/api"]

# v2 (reserved, not used yet): domain vocabulary and extra writing rules.
glossary: {}
style:
  rules: []

collect:
  out_dir: corpus                  # `collect` writes to <out_dir>/realworld/
